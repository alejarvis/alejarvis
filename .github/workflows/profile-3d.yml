name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: alejarvis
      - name: Clean contribution graph
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = "http://www.w3.org/2000/svg"
          ET.register_namespace("", ns)

          for theme in ["profile-night-green", "profile-green"]:
              path = Path(f"profile-3d-contrib/{theme}.svg")
              tree = ET.parse(path)
              root = tree.getroot()

              for parent in root.iter():
                  for child in list(parent):
                      tag = child.tag.split("}")[-1]

                      if tag in ["text", "circle", "line", "path", "polyline"]:
                          parent.remove(child)

                      elif tag == "rect":
                          if child in list(root):
                              parent.remove(child)

              tree.write(
                  f"profile-3d-contrib/{theme}-minimal.svg",
                  encoding="unicode"
              )
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/
          if git commit -m "Update 3D contribution graph"; then
            git push
          fi
